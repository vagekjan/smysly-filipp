<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>От достигателя к стратегу · смысловая история</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --ink:#17161A; --ink2:#4A4D52; --muted:#8C8677;
    --accent:#F2B600; --accent-ink:#8A5A12; --green:#2F5A2A; --red:#b3392b; --violet:#6b4a9e;
    --rule:#E7E3D8; --surface:#FBFAF7; --faint:#D9D4C6; --wire:#B9B3A3;
    --sans:'Golos Text',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --disp:'Oswald',var(--sans); --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--surface);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;height:100vh;overflow:hidden}
  body.philip .arch-only{display:none !important}
  body.philip .mk{display:none !important}
  body.philip .ttype{display:none !important}
  body.philip .notclaim:not(.essential){display:none !important}

  .top{flex:none;display:flex;align-items:center;gap:16px;padding:9px 22px;background:#fff;border-bottom:1px solid var(--rule)}
  .brand{font-family:var(--disp);font-weight:500;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .chapters{display:flex;gap:4px;flex:1;overflow:hidden}
  .chapters button{font-family:var(--mono);font-size:.6rem;padding:5px 8px;border:1px solid var(--rule);border-radius:20px;background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chapters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .toggle{flex:none;display:flex;border:1px solid var(--ink);border-radius:6px;overflow:hidden}
  .toggle button{font-family:var(--disp);font-weight:500;font-size:.68rem;padding:5px 10px;border:0;background:#fff;color:var(--ink2);cursor:pointer}
  .toggle button.on{background:var(--ink);color:#fff}

  .stagewrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:16px}
  .stage{width:min(100%, calc((100vh - 130px) * 1.777));aspect-ratio:16/9;max-height:100%;background:var(--bg);border:1px solid var(--rule);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.10);position:relative;overflow:hidden}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;padding:2.6vh 3vw}
  .slide.active{display:flex;animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .locator{flex:none;display:flex;align-items:baseline;gap:10px;margin-bottom:1.5vh}
  .loc-ch{font-family:var(--disp);font-weight:500;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink)}
  .loc-t{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
  .loc-dot{width:5px;height:5px;border-radius:50%;background:var(--faint)}
  .badge{margin-left:auto;font-family:var(--mono);font-size:.6rem;letter-spacing:.03em;color:var(--violet);border:1px solid var(--violet);border-radius:20px;padding:3px 9px}

  h1{font-family:var(--disp);font-weight:500;font-size:clamp(1.4rem,3.1vw,2.8rem);line-height:1.05;letter-spacing:-.015em;margin:0 0 1.1vh;max-width:20ch;text-wrap:balance}
  .stmt{font-family:var(--sans);font-weight:600;font-size:clamp(1rem,1.95vw,1.68rem);line-height:1.2;letter-spacing:-.005em;color:var(--ink);margin:0 0 1.3vh;max-width:34ch;text-wrap:pretty}
  .slide.center{justify-content:center;align-items:center;position:relative}
  .slide.center .locator{position:absolute;top:2.6vh;left:3vw;margin:0}
  .slide.center .stmt{font-size:clamp(1.3rem,2.7vw,2.3rem);font-weight:400;color:var(--ink2);max-width:28ch;margin:0 auto;text-align:center;line-height:1.26;text-wrap:balance}
  .slide.center .stmt b{font-weight:700;color:var(--ink)}
  .slide.center .trans,.slide.center .arch-only,.slide.center .notclaim{position:relative;z-index:1}
  .visbig{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
  .visbig svg{width:100%;max-height:60vh;height:auto}
  .visbig img{max-height:60vh;max-width:100%;border-radius:6px}
  .visnote{font-family:var(--sans);font-size:clamp(.8rem,1.15vw,1.02rem);color:var(--ink2);text-align:center;max-width:52ch;margin:1.4vh auto 0}
  .ladder{width:100%;max-width:62ch;margin:0 auto;border:1px solid var(--rule);border-radius:9px;overflow:hidden;background:#fff}
  .rung{display:flex;gap:18px;align-items:baseline;padding:1.15vh 22px;border-top:1px solid var(--rule)}
  .rung:first-child{border-top:0}
  .rung .rl{font-family:var(--disp);font-weight:500;font-size:clamp(.92rem,1.4vw,1.2rem);flex:none;width:154px;color:var(--ink)}
  .rung .rd{font-size:clamp(.74rem,1.02vw,.94rem);color:var(--ink2);line-height:1.32}
  .rung.focus{background:#FCF6DC}
  .rung.focus .rl{color:var(--accent-ink)}
  .why{font-size:clamp(.82rem,1.15vw,1.05rem);color:var(--ink2);max-width:54ch;margin:0 0 1.6vh;line-height:1.4}
  .why b{font-weight:600;color:var(--ink)}

  .body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:2.6vw;align-items:center}
  .body.solo{grid-template-columns:1fr}
  .body.solo .txt{max-width:66ch;margin:0 auto;text-align:center}
  .body.wide{grid-template-columns:1fr;align-content:center;gap:1.4vh}
  .body.wide .vis svg{max-height:34vh}
  .body.wide .txt{max-width:72ch}
  .txt{min-width:0}
  .vis{min-width:0;display:flex;align-items:center;justify-content:center;height:100%}
  .vis svg{width:100%;height:auto;max-height:54vh}
  .vis img{max-height:54vh;max-width:100%;border-radius:5px}

  .stand{display:flex;flex-direction:column;gap:.9vh;margin:0 0 1.2vh}
  .st{display:flex;gap:9px;align-items:baseline;font-size:clamp(.82rem,1.08vw,1.02rem);color:var(--ink2);line-height:1.38}
  .mk{flex:none;font-family:var(--mono);font-size:.56rem;font-weight:500;letter-spacing:.03em;padding:2px 6px;border-radius:3px;text-transform:uppercase;transform:translateY(-1px)}
  .mk.ist{background:#E6EFE2;color:var(--green)}
  .mk.gip{background:#FBEFD3;color:var(--accent-ink)}
  .mk.nasha{background:#EEE6F5;color:var(--violet)}
  .mk.treb{background:#F3E3E1;color:var(--red)}
  .notclaim{font-size:clamp(.78rem,1vw,.95rem);color:var(--red);max-width:54ch;line-height:1.34;display:flex;gap:8px;margin-top:.6vh}
  .notclaim .x{font-weight:600;flex:none}

  .trans{flex:none;margin-top:1.3vh;padding-top:1.1vh;border-top:1px solid var(--rule);display:flex;align-items:center;gap:12px}
  .ttype{font-family:var(--mono);font-size:.56rem;text-transform:uppercase;letter-spacing:.04em;padding:3px 7px;border-radius:3px;flex:none}
  .tt-log{background:#E4EDF5;color:#2b6fb3}.tt-nar{background:#F0EEE8;color:var(--ink2)}.tt-voz{background:#F3E3E1;color:var(--red)}.tt-prod{background:#EEE6F5;color:var(--violet)}
  .ttext{font-size:clamp(.82rem,1.05vw,1rem);color:var(--ink);line-height:1.34}
  .ttext b{color:var(--accent-ink);font-weight:600}

  .arch-only{margin-top:1vh;padding:.9vh 1.1vw;background:var(--surface);border:1px solid var(--rule);border-radius:6px}
  .arch-only .ah{font-family:var(--disp);font-weight:500;font-size:.72rem;color:var(--accent-ink);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
  .arch-only .ar{font-size:.8rem;color:var(--ink2);line-height:1.35;margin-bottom:2px}
  .chip{font-family:var(--mono);font-size:.6rem;padding:1px 5px;border-radius:2px;background:#F0EEE8;color:var(--ink2)}

  .title-slide{align-items:center;justify-content:center;text-align:center}
  .title-slide h1{font-size:clamp(2rem,5vw,4.4rem);max-width:16ch}
  .title-sub{font-family:var(--disp);font-weight:400;font-size:clamp(1rem,1.6vw,1.4rem);color:var(--ink2);margin-top:1.2vh}
  .title-hint{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-top:3.4vh;line-height:1.7}
  .title-hint kbd{background:#fff;border:1px solid var(--rule);border-radius:4px;padding:1px 6px}

  .map-arc{font-family:var(--disp);font-weight:400;font-size:clamp(1rem,1.6vw,1.45rem);color:var(--ink);text-align:center;max-width:40ch;margin:0 auto 4vh;line-height:1.3}
  .map-arc b{color:var(--accent-ink)}
  .map-flow{display:flex;align-items:stretch;justify-content:center;gap:0;flex:1;max-width:96%;margin:0 auto;width:100%}
  .map-step{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;border-radius:10px;padding:2vh .6vw;transition:background .12s}
  .map-step:hover{background:var(--surface)}
  .map-k{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-bottom:1.2vh}
  .map-name{font-family:var(--disp);font-weight:500;font-size:clamp(1rem,1.55vw,1.55rem);line-height:1.1;color:var(--ink)}
  .map-sep{align-self:center;font-size:1.6rem;color:var(--faint);flex:none;padding:0 .2vw}

  .nav{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 22px;background:#fff;border-top:1px solid var(--rule)}
  .nav .side{display:flex;align-items:center;gap:8px}
  .nav button{font-family:var(--disp);font-weight:500;font-size:.82rem;padding:7px 15px;border:1px solid var(--ink);border-radius:7px;background:#fff;color:var(--ink);cursor:pointer}
  .nav button.primary{background:var(--ink);color:#fff}
  .nav button.ghost{border-color:var(--rule);color:var(--muted)}
  .nav button:disabled{opacity:.28;cursor:default}
  .prog{flex:1;margin:0 18px;height:4px;background:var(--rule);border-radius:2px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
  .mid{font-family:var(--mono);font-size:.68rem;color:var(--muted);white-space:nowrap}
</style>
</head>
<body class="philip">

<div class="top">
  <span class="brand">От достигателя к стратегу</span>
  <div class="chapters" id="chapters"></div>
  <div class="toggle"><button id="bP" class="on">Presentation</button><button id="bA">Architect</button></div>
</div>

<div class="stagewrap"><div class="stage" id="stage"></div></div>

<div class="nav">
  <div class="side"></div>
  <button id="prev">← Назад</button>
  <div class="prog"><i id="progbar"></i></div>
  <div class="mid" id="mid"></div>
  <button id="next" class="primary">Далее →</button>
</div>

<script>
const A='#17161A',G='#8C8677',Y='#F2B600',AI='#8A5A12',R='#b3392b',GR='#2F5A2A',VI='#6b4a9e',W='#B9B3A3',F='#D9D4C6';
const mk=(id)=>`<defs><marker id="${id}" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="${A}"/></marker></defs>`;

function logicsMap(opt){opt=opt||{};
 const names=['Оппортунист','Дипломат','Эксперт','Достигатель','Индивидуалист','Стратег','Алхимик'];
 const hi=[3,4,5];
 const ticks=names.map((n,i)=>{const x=40+i*52;const on=hi.includes(i);
   return `<line x1="${x}" y1="70" x2="${x}" y2="86" stroke="${on?A:W}" stroke-width="${on?2.4:1.4}"/>`+
   `<text x="${x}" y="108" text-anchor="middle" font-family="Golos Text" font-size="10.5" fill="${on?A:G}" transform="rotate(28 ${x} 108)">${n}</text>`;
 }).join('');
 const band=`<rect x="${40+3*52-16}" y="60" width="${52*2+32}" height="34" rx="6" fill="#FCF3D2" stroke="${Y}" stroke-width="1.5"/>`;
 const incl=opt.include?`<g transform="translate(300,150)"><circle cx="0" cy="0" r="8" fill="none" stroke="${W}" stroke-width="1.4"/><circle cx="0" cy="0" r="15" fill="none" stroke="${A}" stroke-width="1.6"/><text x="26" y="4" font-family="Golos Text" font-size="11" fill="${A}">каждая следующая ВКЛЮЧАЕТ предыдущую</text></g>`:'';
 const cap=opt.cap?`<text x="200" y="150" text-anchor="middle" font-family="Golos Text" font-size="11.5" fill="${G}">${opt.cap}</text>`:'';
 return `<svg viewBox="0 0 400 175"><line x1="30" y1="78" x2="396" y2="78" stroke="${F}" stroke-width="1.4"/>${band}${ticks}${cap}${incl}<text x="200" y="24" text-anchor="middle" font-family="Golos Text" font-size="11" fill="${G}">карта логик действия, а не рейтинг людей</text></svg>`;
}

const LOG=[
 ['Оппортунист','выиграть любой ценой, не думая о последствиях'],
 ['Дипломат','командный игрок, хранит правила, избегает конфликтов'],
 ['Эксперт','ценит точное знание и логику, решает по основаниям'],
 ['Достигатель','волей и целью добивается успеха и ведёт команду'],
 ['Индивидуалист','уходит от гонки, живёт в моменте, познаёт себя'],
 ['Стратег','системное, интегральное мышление, видит дальние эффекты'],
 ['Алхимик','«не от мира сего», трансформации исторического масштаба'],
];
function ladder(caption){
 return '<div class="ladder">'+LOG.map((r,i)=>{const f=i>=3&&i<=5;return `<div class="rung${f?' focus':''}"><div class="rl">${r[0]}</div><div class="rd">${r[1]}</div></div>`;}).join('')+'</div>'+(caption?`<div class="visnote">${caption}</div>`:'');
}

const V={
hv:`<svg viewBox="0 0 400 210">${mk('h1')}
 <text x="100" y="20" text-anchor="middle" font-family="Oswald" font-size="14" fill="${G}">ГОРИЗОНТАЛЬНОЕ</text>
 <rect x="46" y="40" width="46" height="72" rx="6" fill="none" stroke="${A}" stroke-width="1.8"/>
 ${[0,1,2,3].map(i=>`<rect x="${52+(i%2)*20}" y="${50+Math.floor(i/2)*22}" width="14" height="14" rx="3" fill="${F}"/>`).join('')}
 <path d="M100 76 H 118" stroke="${A}" stroke-width="2" marker-end="url(#h1)"/>
 <rect x="124" y="40" width="46" height="72" rx="6" fill="none" stroke="${A}" stroke-width="1.8"/>
 ${[0,1,2,3,4,5].map(i=>`<rect x="${130+(i%2)*20}" y="${48+Math.floor(i/2)*22}" width="14" height="14" rx="3" fill="${F}"/>`).join('')}
 <text x="108" y="130" text-anchor="middle" font-family="Golos Text" font-size="12" fill="${A}">та же система —</text><text x="108" y="148" text-anchor="middle" font-family="Golos Text" font-size="12" fill="${A}">больше возможностей</text>
 <line x1="200" y1="30" x2="200" y2="180" stroke="${F}"/>
 <text x="300" y="20" text-anchor="middle" font-family="Oswald" font-size="14" fill="${AI}">ВЕРТИКАЛЬНОЕ</text>
 <rect x="230" y="52" width="20" height="20" rx="2" fill="#D8DEE6" stroke="${A}" stroke-width="1.2"/><rect x="254" y="52" width="20" height="20" rx="2" fill="#D8DEE6" stroke="${A}" stroke-width="1.2"/><rect x="230" y="76" width="20" height="20" rx="2" fill="#D8DEE6" stroke="${A}" stroke-width="1.2"/><rect x="254" y="76" width="20" height="20" rx="2" fill="#D8DEE6" stroke="${A}" stroke-width="1.2"/>
 <text x="252" y="112" text-anchor="middle" font-family="Golos Text" font-size="10.5" fill="${G}">Windows</text>
 <path d="M284 74 H 304" stroke="${AI}" stroke-width="2.4" marker-end="url(#h1)"/>
 <path d="M336 64 C 328 52, 312 56, 312 73 C 312 91, 324 102, 336 102 C 348 102, 360 91, 360 73 C 360 56, 344 52, 336 64 Z" fill="#FCF3D2" stroke="${AI}" stroke-width="2"/>
 <circle cx="365" cy="74" r="9" fill="${'#FFFFFF'}"/>
 <path d="M338 62 q 5 -11 15 -11 q -2 9 -15 11 z" fill="${GR}"/>
 <text x="336" y="112" text-anchor="middle" font-family="Golos Text" font-size="10.5" fill="${G}">Mac</text>
 <text x="300" y="140" text-anchor="middle" font-family="Golos Text" font-size="12" fill="${AI}">меняется сама система</text></svg>`,

traditions:`<svg viewBox="0 0 400 200">${mk('t2')}
 ${[['психология развития',44],['теории эго-развития',86],['логики действия · Торберт',128],['лидерские школы',170]].map(d=>`<circle cx="60" cy="${d[1]}" r="6" fill="none" stroke="${A}" stroke-width="1.6"/><text x="76" y="${d[1]+4}" font-family="Golos Text" font-size="11.5" fill="${A}">${d[0]}</text><path d="M198 ${d[1]} C 250 ${d[1]}, 270 106, 300 106" fill="none" stroke="${W}" stroke-width="1.4" marker-end="url(#t2)"/>`).join('')}
 <rect x="300" y="86" width="92" height="42" rx="8" fill="#F0EEE8" stroke="${A}"/><text x="346" y="103" text-anchor="middle" font-family="Golos Text" font-size="11.5" fill="${A}">взрослое</text><text x="346" y="119" text-anchor="middle" font-family="Golos Text" font-size="11.5" fill="${A}">развитие</text>
 <text x="200" y="192" text-anchor="middle" font-family="Golos Text" font-size="11" fill="${G}">разные традиции, а не одна общая теория</text></svg>`,

logics3:ladder('Каждая следующая логика включает предыдущую. Это карта, а не рейтинг людей.'),
logics5:ladder('Всю карту держим для целостности — работаем на участке Достигатель → Индивидуалист → Стратег.'),

optics:`<svg viewBox="0 0 400 210">${mk('o4')}
 <rect x="150" y="14" width="100" height="34" rx="7" fill="#F0EEE8" stroke="${A}"/><text x="200" y="35" text-anchor="middle" font-family="Golos Text" font-size="12" fill="${A}">одна задача</text>
 <path d="M180 48 C 150 66, 120 74, 110 88" fill="none" stroke="${W}" stroke-width="1.5" marker-end="url(#o4)"/>
 <path d="M220 48 C 250 66, 280 74, 290 88" fill="none" stroke="${W}" stroke-width="1.5" marker-end="url(#o4)"/>
 <ellipse cx="100" cy="100" rx="52" ry="20" fill="none" stroke="${A}" stroke-width="1.6"/><text x="100" y="104" text-anchor="middle" font-family="Golos Text" font-size="11" fill="${A}">оптика 1</text>
 <ellipse cx="300" cy="100" rx="52" ry="20" fill="none" stroke="${AI}" stroke-width="1.6"/><text x="300" y="104" text-anchor="middle" font-family="Golos Text" font-size="11" fill="${AI}">оптика 2</text>
 <g font-family="Golos Text" font-size="10.5" fill="${A}"><text x="100" y="150" text-anchor="middle">решения A · B</text><text x="100" y="168" text-anchor="middle">(видны только отсюда)</text></g>
 <g font-family="Golos Text" font-size="10.5" fill="${AI}"><text x="300" y="150" text-anchor="middle">решения C · D</text><text x="300" y="168" text-anchor="middle">(видны только отсюда)</text></g>
 <line x1="100" y1="122" x2="100" y2="138" stroke="${W}"/><line x1="300" y1="122" x2="300" y2="138" stroke="${W}"/>
 <text x="200" y="198" text-anchor="middle" font-family="Golos Text" font-size="11" fill="${G}">оптика определяет, какие ходы вообще доступны</text></svg>`,

dims:`<svg viewBox="0 0 400 200">
 ${['мотивация','смыслы','отношения','идентичность','отношение к успеху','качество жизни'].map((t,i)=>{const y=32+i*28;const p=[.7,.3,.55,.4,.8,.5][i];return `<text x="20" y="${y+4}" font-family="Golos Text" font-size="11" fill="${A}">${t}</text><line x1="170" y1="${y}" x2="380" y2="${y}" stroke="${F}" stroke-width="4" stroke-linecap="round"/><line x1="170" y1="${y}" x2="${170+210*p}" y2="${y}" stroke="${A}" stroke-width="4" stroke-linecap="round"/><circle cx="${170+210*p}" cy="${y}" r="5" fill="${Y}"/>`}).join('')}
 <text x="275" y="196" text-anchor="middle" font-family="Golos Text" font-size="10.5" fill="${G}">измерения независимы — меняются по-разному</text></svg>`,

achiever:`<svg viewBox="0 0 400 150">${mk('ac')}
 <g font-family="Oswald" font-size="16" fill="${A}"><text x="40" y="66" text-anchor="middle">цель</text><text x="150" y="66" text-anchor="middle">план</text><text x="256" y="66" text-anchor="middle">усилие</text><text x="356" y="66" text-anchor="middle">результат</text></g>

const stage=document.getElementById('stage');
const ttClass={log:'tt-log',nar:'tt-nar',voz:'tt-voz',prod:'tt-prod'};
const chipCls={'ИСТ':'ist','ГИП':'gip','РАМКА':'gip','НАША':'nasha','ТРЕБ':'treb','ВЫВОД':'ist'};
function mkChip(m){return `<span class="mk ${chipCls[m]||'gip'}">${m}</span>`;}

function slideHTML(s){
  if(s.kind==='title') return `<div class="slide title-slide"><h1>От достигателя к стратегу</h1><div class="title-sub">смысловая история · 21 тезис доказательной цепочки</div><div class="title-hint"><kbd>→</kbd> Далее · <kbd>←</kbd> Назад · переключатель <b>Presentation / Architect</b> справа вверху</div></div>`;
  if(s.kind==='map'){
    return `<div class="slide"><div class="locator"><span class="loc-ch">Карта истории</span></div>
    <div class="map-arc">от «<b>почему становится тесно?</b>» — к «<b>какой маршрут мой?</b>»</div>
    <div class="map-flow">${CH.map((c,i)=>`<div class="map-step" data-jump="${i}"><span class="map-k">${c.k}</span><span class="map-name">${c.name}</span></div>`+(i<CH.length-1?'<span class="map-sep">→</span>':'')).join('')}</div></div>`;
  }
  if(s.kind==='final'){
    return `<div class="slide"><div class="locator"><span class="loc-ch">Итог истории</span></div>
    <h1>Общая карта ≠ мой маршрут</h1>
    <div class="body"><div class="txt">
    <p class="why" style="font-size:clamp(.86rem,1.25vw,1.1rem)">Общая карта <b>объясняет</b>, что может происходить. Но её понимания <b>недостаточно</b>, чтобы определить мою ситуацию.</p>
    <p class="why" style="font-size:clamp(.86rem,1.25vw,1.1rem)">Похожая задача у разных людей — разные причины, ограничения, ресурсы и рычаги. Вопрос становится: <b>«где именно я, что уже сила, что ограничивает и какой маршрут мой?»</b></p>
    </div><div class="vis">${V.finalvis}</div></div>
    <div class="trans"><span class="ttype tt-prod">продуктовый мост</span><span class="ttext">дальше — <b>как эту траекторию получить</b> (механика воронки — отдельный слой, не эта презентация)</span></div></div>`;
  }
  const bigHTML=s.big?`<div style="display:flex;flex-direction:column;gap:1.8vh;max-width:62ch;margin:0 auto">${s.big.map(q=>`<div style="font-family:var(--disp);font-weight:400;font-size:clamp(1.05rem,1.9vw,1.6rem);line-height:1.22;color:var(--ink)">${q}</div>`).join('')}</div>`:'';
  const standHTML=s.stand&&s.stand.length?`<div class="stand">${s.stand.map(x=>`<div class="st">${mkChip(x.m)}<span>${x.t}</span></div>`).join('')}</div>`:'';
  const notHTML=s.not?`<div class="notclaim${s.essential?' essential':''}"><span class="x">Важно:</span><span>${s.not}</span></div>`:'';
  const standRows=s.stand&&s.stand.length?s.stand.map(x=>`<div class="ar"><span class="chip">${x.m}</span> ${x.t}</div>`).join(''):'';
  const archHTML=`<div class="arch-only"><div class="ah">Architect / sources</div>${s.why?`<div class="ar"><b>Функция:</b> ${s.why}</div>`:''}${standRows}${s.arch&&s.arch.s?`<div class="ar"><span class="chip">${s.arch.s}</span></div>`:''}${s.arch&&s.arch.open?`<div class="ar">${s.arch.open}</div>`:''}</div>`;
  const transHTML=`<div class="trans"><span class="ttype ${ttClass[s.trans.type]}">${s.trans.label}</span><span class="ttext">${s.trans.text}</span></div>`;
  const loc=(suf)=>`<div class="locator"><span class="loc-ch">${CH[s.ch].k} · ${CH[s.ch].name}</span><span class="loc-dot"></span><span class="loc-t">${s.loc}${suf||''}</span>${s.badge?`<span class="badge">${s.badge}</span>`:''}</div>`;
  if(s.mode==='stmt') return `<div class="slide center">${loc()}<div class="stmt">${s.h}</div></div>`;
  if(s.mode==='vis') return `<div class="slide">${loc(' · схема')}<div class="visbig">${V[s.vis]||''}</div>${notHTML}${archHTML}${transHTML}</div>`;
  // solo — тезис без визуала (напр. Т13·2/2)
  return `<div class="slide center">${loc()}<div class="stmt">${s.h}</div>${bigHTML}${notHTML}${archHTML}${transHTML}</div>`;
}

const KEEP_NOT=new Set(['Т3','Т9','Т10','Т11','Т12','Т16']);
S.forEach(s=>{if(s.loc&&KEEP_NOT.has(s.loc))s.essential=true;});

// разворачиваем каждый тезис в кадры: тезис → (его схема отдельным кадром)
const FR=[];
S.forEach(s=>{
  if(s.kind){FR.push(s);return;}
  if(s.vis){FR.push(Object.assign({},s,{mode:'stmt'}));FR.push(Object.assign({},s,{mode:'vis'}));}
  else{FR.push(Object.assign({},s,{mode:'solo'}));}
});

stage.innerHTML=FR.map(slideHTML).join('');
const slides=[...stage.querySelectorAll('.slide')];
let pos=0;

const chbar=document.getElementById('chapters');
chbar.innerHTML=CH.map((c,i)=>`<button data-ch="${i}">${c.k}</button>`).join('');
const chFirst=CH.map((c,i)=>FR.findIndex(s=>s.ch===i));
function chapterOf(i){const s=FR[i];return s.kind?-1:s.ch;}
function render(){
  slides.forEach((el,i)=>el.classList.toggle('active',i===pos));
  const s=FR[pos];
  document.getElementById('prev').disabled=pos===0;
  document.getElementById('next').disabled=pos===FR.length-1;
  document.getElementById('progbar').style.width=(pos/(FR.length-1)*100)+'%';
  let label=s.kind==='title'?'Титул':s.kind==='final'?'Итог':(CH[s.ch].name+' · '+s.loc);
  document.getElementById('mid').textContent=label+'   ·   '+(pos+1)+'/'+FR.length;
  const ch=chapterOf(pos);
  [...chbar.children].forEach((b,i)=>b.classList.toggle('on',i===ch));
}
function go(i){pos=Math.max(0,Math.min(FR.length-1,i));render();}
document.getElementById('next').onclick=()=>go(pos+1);
document.getElementById('prev').onclick=()=>go(pos-1);
chbar.onclick=e=>{const b=e.target.closest('button');if(b)go(chFirst[+b.dataset.ch]);};
stage.addEventListener('click',e=>{const r=e.target.closest('[data-jump]');if(r)go(chFirst[+r.dataset.jump]);});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(pos+1);}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(pos-1);}});
const b=document.body,bP=document.getElementById('bP'),bA=document.getElementById('bA');
bP.onclick=()=>{b.classList.add('philip');b.classList.remove('architect');bP.classList.add('on');bA.classList.remove('on');};
bA.onclick=()=>{b.classList.add('architect');b.classList.remove('philip');bA.classList.add('on');bP.classList.remove('on');};
render();
</script>
</body>
</html>
