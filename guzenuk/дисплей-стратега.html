document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-transform: uppercase\">{{ r.name }}<\u002Fspan>\n                    <span style=\"flex: none; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: #17161A\">{{ r.pair }}<\u002Fspan>\n                    <span style=\"flex: none; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; width: 40px; text-align: right; color: {{ r.gapColor }}\">{{ r.gapLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size: 13px; line-height: 1.45; color: #4A4D52; margin: 5px 0 0 22px\">{{ r.note }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background: #17161A; color: #FBF8F1; padding: 26px 30px; margin-top: 26px; display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 38px; align-items: center\">\n            <div>\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: #F2B600\">главный разрыв<\u002Fdiv>\n              <div style=\"font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 36px; line-height: 1.02; text-transform: uppercase; margin-top: 10px\">{{ topName }}<\u002Fdiv>\n              <div style=\"font-size: 15.5px; line-height: 1.5; color: #CFC9BB; margin-top: 10px\">{{ topNote }}<\u002Fdiv>\n            <\u002Fdiv>\n            <a href=\"#\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.18em; text-transform: uppercase; background: #2F5A2A; color: #FFFFFF; padding: 17px 24px; text-decoration: none; transition: background 0.18s\" style-hover=\"background: #F2B600; color: #17161A\">\n              разобрать на живой сессии\n              <svg sc-camel-view-box=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" style=\"flex: none; width: 16px; height: 16px\"><path d=\"M10 24 H36\"><\u002Fpath><path d=\"M29 17 L36 24 L29 31\"><\u002Fpath><\u002Fsvg>\n            <\u002Fa>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ notEnough }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border: 1px solid rgba(23,22,26,0.14); padding: 32px; margin-top: 22px; max-width: 60ch\">\n            <div style=\"font-size: 17px; line-height: 1.55; color: #4A4D52\">Оцените минимум три фактора — тогда профиль можно будет построить. Сейчас оценено: {{ counter }}.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display: flex; gap: 14px; margin-top: 24px\">\n          <div sc-camel-on-click=\"{{ toCanvas }}\" style=\"cursor: pointer; display: flex; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.18em; text-transform: uppercase; color: #5D5A52; border: 1px solid rgba(23,22,26,0.25); padding: 15px 22px; transition: all 0.16s\" style-hover=\"border-color: #17161A; color: #17161A\">\n            <svg sc-camel-view-box=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" style=\"width: 15px; height: 15px\"><path d=\"M38 24 H12\"><\u002Fpath><path d=\"M19 17 L12 24 L19 31\"><\u002Fpath><\u002Fsvg>\n            к схеме\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ reset }}\" style=\"cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #5D5A52; border: 1px solid rgba(23,22,26,0.22); padding: 15px 18px\" style-hover=\"border-color: #17161A; color: #17161A\">начать заново<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ panelOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex: none; width: 380px; border-left: 1px solid rgba(23,22,26,0.14); display: flex; flex-direction: column; min-height: 0; background: #FBFAF7  color: {{ m.color }}; border-left: 3px solid {{ m.edge }}; font-size: 13.5px; line-height: 1.55\">{{ m.text }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"flex: none; padding: 13px 18px; border-top: 1px solid rgba(23,22,26,0.12); display: flex; gap: 10px\">\n          <textarea value=\"{{ input }}\" sc-camel-on-change=\"{{ onInput }}\" sc-camel-on-key-down=\"{{ onKey }}\" placeholder=\"Ваш ответ…\" style=\"flex: 1; padding: 11px 12px; border: 1px solid rgba(23,22,26,0.2); background: #FFFFFF; color: #17161A; font-family: 'Golos Text', sans-serif; font-size: 13.5px; outline: none; resize: none; height: 44px\"><\u002Ftextarea>\n          <div sc-camel-on-click=\"{{ send }}\" style=\"cursor: pointer; flex: none; width: 44px; height: 44px; background: #2F5A2A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; transition: background 0.16s\" style-hover=\"background: #17161A\">\n            <svg sc-camel-view-box=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" style=\"width: 16px; height: 16px\"><path d=\"M10 24 H36\"><\u002Fpath><path d=\"M29 17 L36 24 L29 31\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}\">\nconst FACTORS = [\n  { id: 'mis', code: 'М', name: 'Миссия', sub: 'Зачем мы существуем? Какую большую задачу решаем?' },\n  { id: 'vis', code: 'В', name: 'Видение', sub: 'Где мы хотим оказаться через 5–10 лет?' },\n  { id: 'val', code: 'Ц', name: 'Ценности', sub: 'Во что верим? Какие принципы определяют решения?' },\n  { id: 'pestel', code: 'PE', name: 'PESTEL', sub: 'Политика, экономика, общество, технологии, экология, право.' },\n  { id: 'stake', code: 'СТ', name: 'Стейкхолдеры', sub: 'Клиенты, конкуренты, партнёры, акц какую цифру выручки вы целитесь в горизонте 12 месяцев?', 'Какие 2–3 поддерживающие цели обеспечат рыночную?', 'Какая цель из списка самая хрупкая и почему?'],\n  ini: ['Назовите 3 главных проекта, которые идут сейчас.', 'У каждого есть один владелец и понятный дедлайн?', 'Какой сдвинется на квартал, если пропадёт ключевой человек?'],\n  pestel: ['Какой регуляторный риск может убить модель за 6 месяцев?', 'Какой технологический тренд вы игнорируете или не понимаете?', 'На каких макроэкономических допущениях держится план?'],\n  stake: ['Кто 3 внешних игрока, чьи решения влияют на вас сильнее всего?', 'Что каждый хочет от вас — и что вы от него?', 'С кем из них отношения сейчас самые слабые?'],\n  ks: ['Опишите ключевого клиента в трёх предложениях.', 'Какая доля выручки приходит от топ-3 сегментов?', 'Какой сегмент вы обслуживаете, но не должны бы?'],\n  cv: ['Сформулируйте работу клиента: «когда я… я хочу… чтобы…».', 'Почему клиент выберет вас, а не лучшую альтернативу?', 'Если конкурент скопирует ценность — что останется уникальным?'],\n  ko: ['Опишите путь клиента от первого контакта до повторной покупки.', 'Какая точка касания приносит клиенту больше всего боли?', 'Какие метрики опыта вы смотрите еженедельно?'],\n  kk: ['Назовите 1–2 компетенции, где вы объективно сильнее конкурентов.', 'Эта компетенция масштабируется или держится на 1–2 людях?', 'Какой дефицит компетенций ограничивает рост?'],\n  su: ['Опишите оргструктуру в трёх уровнях.', 'Сколько времени проходит от решения до исполнения?', 'Какие 2–3 метрики лидер смотрит каждую неделю?'],\n  ku: ['Опишите культуру компании одной метафорой.', 'Какой ритуал самый ценный, какой самый токсичный?', 'Что декларируется в ценностях, но не работает на практике?'],\n  team: ['Кто 5 человек, без которых компания развалится за месяц?', 'У этой пятёрки картина будущего совпадает?', 'Кто уйдёт первым, если не сделать движение в течение полугода?'],\n  leader: ['Какие 2–3 ваши сильные стороны делают компанию лучше?', 'Какая слабая зона больше всего тормозит компанию?', 'Кто и как даёт вам честную обратную связь?']\n};\n\nconst FIN = {\n  mis: ['Миссия названа, но абстрактно. Достаточно по этому фактору.', 6, 4],\n  vis: ['Видение есть, метрики размытые. Достаточно.', 7, 5],\n  val: ['Ценности артикулированы, проверьте в реальных кейсах. Достаточно.', 6, 5],\n  vop: ['Главный вопрос обозначен — это половина решения. Достаточно.', 8, 4],\n  orient: ['Ориентиры ясны, проверьте каскад до квартальных метрик. Достаточно.', 9, 6],\n  ini: ['Инициативы есть, владельцы и сроки требуют проверки. Достаточно.', 8, 5],\n  pestel: ['Риски осознаны, план Б не описан. Достаточно.', 6, 3],\n  stake: ['Карта стейкхолдеров намечена, слабые места — в работу. Достаточно.', 7, 4],\n  ks: ['Сегменты понятны, топ-3 могут быть не самыми прибыльными. Достаточно.', 8, 5],\n  cv: ['Ценность есть, уникальность держится на одном факторе. Достаточно.', 9, 5],\n  ko: ['Путь клиента в голове, но не на бумаге — узкое место. Достаточно.', 7, 3],\n  kk: ['Сильные стороны есть, дефицит назван. Достаточно.', 7, 4],\n  su: ['Структура работает, скорость решений требует ускорения. Достаточно.', 6, 5],\n  ku: ['Культура осознана, антипаттерны не адресованы. Достаточно.', 8, 4],\n  team: ['Ключевые люди известны, риски тоже — сильная позиция. Достаточно.', 9, 7],\n  leader: ['Сильные и слабые стороны видны, хорошая основа. Достаточно.', 8, 6]\n};\n\nconst KEY = 'displey.v1';\n\nclass Component extends DCLogic {\n  state = { screen: 'canvas', panel: null, ratings: {}, chats: {}, steps: {}, input: '' };\n\n  componentDidMount() {\n    try {\n      const s = JSON.parse(localStorage.getItem(KEY) || 'null');\n      if (s && s.ratings) this.setState({ ratings: s.ratings, chats: s.chats || {}, steps: s.steps || {} });\n    } catch (e) {}\n  }\n\n  save(patch) {\n    const s = { ...this.state, ...patch };\n    try { localStorage.setItem(KEY, JSON.stringify({ ratings: s.ratings, chats: s.chats, steps: s.steps })); } catch (e) {}\n  }\n\n  factor(id) { return FACTORS.find((f) => f.id === id); }\n\n  coachReply(id) {\n    const step = this.state.steps[id] || 0;\n    const qs = Q[id] || [];\n    if (step < qs.length) return { text: qs[step], score: null };\n    const f = FIN[id] || ['Достаточно.', 5, 5];\n    return { text: f[0], score: { i: f[1], c: f[2] } };\n  }\n\n  push(id, role, text) {\n    return { ...this.state.chats, [id]: (this.state.chats[id] || []).concat([{ role, text }]) };\n  }\n\n  openPanel(id) {\n    if ((this.state.chats[id] || []).length === 0) {\n      const r = this.coachReply(id);\n      const chats = this.push(id, 'coach', r.text);\n      const steps = { ...this.state.steps, [id]: (this.state.steps[id] || 0) + 1 };\n      this.setState({ panel: id, screen: 'canvas', chats, steps, input: '' });\n      this.save({ chats, steps });\n    } else {\n      this.setState({ panel: id, screen: 'canvas', input: '' });\n    }\n  }\n\n  send() {\n    const id = this.state.panel;\n    const txt = this.state.input.trim();\n    if (!id || !txt) return;\n    let chats = this.push(id, 'user', txt);\n    this.setState({ chats, input: '' });\n    const r = this.coachReply(id);\n    chats = { ...chats, [id]: chats[id].concat([{ role: 'coach', text: r.text }]) };\n    const steps = { ...this.state.steps, [id]: (this.state.steps[id] || 0) + 1 };\n    const ratings = r.score ? { ...this.state.ratings, [id]: r.score } : this.state.ratings;\n    this.setState({ chats, steps, ratings });\n    this.save({ chats, steps, ratings });\n  }\n\n  renderVals() {\n    const { screen, panel, ratings, chats, steps, input } = this.state;\n    const rated = FACTORS.filter((f) => ratings[f.id]);\n    const n = rated.length;\n\n    const v = {};\n    FACTORS.forEach((f) => {\n      const r = ratings[f.id];\n      const started = !r && (steps[f.id] || 0) > 0;\n      v['e_' + f.id] = r ? '#2F5A2A' : (started ? '#F2B600' : 'rgba(23,22,26,0.16)');\n      v['ic_' + f.id] = r ? '#2F5A2A' : (started ? '#B98A15' : '#8C8677');\n      v['s_' + f.id] = r ? ('важность ' + r.i + ' · проработка ' + r.c) : (started ? 'в работе' : 'не начато');\n      v['sc_' + f.id] = r ? '#2F5A2A' : (started ? '#B98A15' : '#A8A49B');\n      v['o_' + f.id] = () => this.openPanel(f.id);\n    });\n\n    const R = 184, CX = 240, CY = 240;\n    const ax = (i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / Math.max(n, 1); return [Math.cos(a), Math.sin(a)]; };\n    const pt = (i, val) => { const d = ax(i); const r = R * val / 10; return [CX + r * d[0], CY + r * d[1]]; };\n    const polyOf = (get) => rated.map((f, i) => pt(i, get(f)).map((x) => x.toFixed(1)).join(',')).join(' ');\n    const rings = [2, 4, 6, 8, 10].map((lv) => ({ pts: rated.map((f, i) => pt(i, lv).map((x) => x.toFixed(1)).join(',')).join(' ') }));\n    const axes = rated.map((f, i) => { const p = pt(i, 10); return { x: p[0].toFixed(1), y: p[1].toFixed(1) }; });\n    const axisLabels = rated.map((f, i) => {\n      const d = ax(i); const x = CX + (R + 22) * d[0], y = CY + (R + 22) * d[1];\n      return React.createElement('text', {\n        key: f.id, x: x.toFixed(1), y: y.toFixed(1),\n        textAnchor: Math.abs(d[0]) < 0.2 ? 'middle' : (d[0] < 0 ? 'end' : 'start'),\n        style: { fontFamily: \"'JetBrains Mono', monospace\", fontSize: 10, letterSpacing: '0.08em', fill: '#5D5A52' }\n      }, f.name.toUpperCase());\n    });\n    const dots = [];\n    rated.forEach((f, i) => {\n      const a = pt(i, ratings[f.id].i), b = pt(i, ratings[f.id].c);\n      dots.push({ x: (a[0] - 3.5).toFixed(1), y: (a[1] - 3.5).toFixed(1), color: '#17161A' });\n      dots.push({ x: (b[0] - 3.5).toFixed(1), y: (b[1] - 3.5).toFixed(1), color: '#2F5A2A' });\n    });\n\n    const rows = rated.map((f) => {\n      const r = ratings[f.id]; const gap = r.i - r.c;\n      return {\n        name: f.name, gap,\n        pair: r.i + '/' + r.c,\n        gapLabel: (gap > 0 ? '+' : '') + gap,\n        gapColor: gap >= 3 ? '#B3261E' : (gap >= 1 ? '#8A5A12' : '#2F5A2A'),\n        color: gap >= 3 ? '#B3261E' : (gap >= 1 ? '#F2B600' : '#2F5A2A'),\n        note: gap >= 3 ? 'высокая важность при слабой проработке — приоритет' : (gap >= 1 ? 'есть запас: проработка отстаёт от важности' : 'проработка соответствует важности — опора'),\n        open: () => this.openPanel(f.id)\n      };\n    }).sort((a, b) => b.gap - a.gap);\n\n    const f = panel ? this.factor(panel) : null;\n    const chat = (panel ? (chats[panel] || []) : []).map((m) => ({\n      text: m.text,\n      align: m.role === 'user' ? 'flex-end' : 'flex-start',\n      bg: m.role === 'user' ? '#17161A' : '#FFFFFF',\n      color: m.role === 'user' ? '#FFFFFF' : '#17161A',\n      edge: m.role === 'user' ? '#F2B600' : '#2F5A2A'\n    }));\n\n    return Object.assign(v, {\n      isCanvas: screen === 'canvas',\n      isResult: screen === 'result',\n      enough: screen === 'result' && n >= 3,\n      notEnough: screen === 'result' && n < 3,\n      rings, axes, axisLabels, dots, rows,\n      impPoly: n >= 3 ? polyOf((x) => ratings[x.id].i) : '',\n      wrkPoly: n >= 3 ? polyOf((x) => ratings[x.id].c) : '',\n      counter: n + ' из 16',\n      fill: (n / 16 * 100) + '%',\n      topName: rows.length ? rows[0].name : '—',\n      topNote: rows.length ? rows[0].note : '',\n      resColor: screen === 'result' ? '#FFFFFF' : '#2F5A2A',\n      resBg: screen === 'result' ? '#2F5A2A' : 'transparent',\n      resBorder: screen === 'result' ? '#2F5A2A' : 'rgba(47,90,42,0.4)',\n      toResult: () => this.setState({ screen: 'result', panel: null }),\n      toCanvas: () => this.setState({ screen: 'canvas' }),\n      panelOpen: !!panel,\n      panelCode: f ? f.code : '',\n      panelName: f ? f.name : '',\n      panelSub: f ? f.sub : '',\n      panelRated: !!(panel && ratings[panel]),\n      panelImp: panel && ratings[panel] ? ratings[panel].i : '',\n      panelWrk: panel && ratings[panel] ? ratings[panel].c : '',\n      chat, input,\n      onInput: (e) => this.setState({ input: e.target.value }),\n      onKey: (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.send(); } },\n      send: () => this.send(),\n      closePanel: () => this.setState({ panel: null }),\n      reset: () => {\n        this.setState({ ratings: {}, chats: {}, steps: {}, panel: null, screen: 'canvas', input: '' });\n        this.save({ ratings: {}, chats: {}, steps: {} });\n      }\n    });\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
