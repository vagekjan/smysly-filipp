<!DOCTYPE html>
<meta charset="utf-8">
<title>Диагностика перехода · стратегический профиль</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23F2EEE6'/><path d='M22 76 C22 40 48 22 58 44 C65 58 43 64 43 46 C43 30 68 28 82 20' fill='none' stroke='%23C08424' stroke-width='7' stroke-linecap='round'/></svg>">
<style>
  :root{--paper:#FFFFFF;--card:#FFFFFF;--ink:#17161A;--ink2:#4A4D52;--accent:#F2B600;--accent-ink:#8A5A12;--accent-lit:#F2B600;
    --green:#2F5A2A;--green-ink:#2F5A2A;--muted:#8C8677;--wash:#EFEDE8;--sel:#F4F2ED;--rule:rgba(23,22,26,.12);--rule2:rgba(23,22,26,.16)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--paper);color:var(--ink);font-family:'Golos Text',sans-serif;line-height:1.55;overflow-x:hidden;display:flex;flex-direction:column;min-height:100vh}
  .wrap{max-width:920px;margin:0 auto;padding:0 clamp(24px,4vw,44px);width:100%}
  .top{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--rule2);padding:14px 0}
  .top .wrap{display:flex;align-items:center;gap:16px;max-width:1080px}
  .brand{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
  .prog{flex:1;display:flex;gap:4px}
  .prog span{flex:1;height:3px;background:var(--rule2)}
  .prog span.f{background:var(--accent)}
  .stepn{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--ink2);white-space:nowrap}
  main{flex:1;display:flex;align-items:center;padding:40px 0}
  #app{width:100%}
  .kick{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:16px}
  h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(36px,5.2vw,72px);line-height:1;letter-spacing:0;text-transform:uppercase;margin:0}
  h2{font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(30px,4vw,54px);line-height:1.02;letter-spacing:0;text-transform:uppercase;margin:0 0 6px}
  .acc{color:var(--accent)}
  p.lead{font-size:clamp(15px,1.6vw,18px);color:var(--ink2);max-width:64ch;margin:16px 0 0}
  p.q{font-size:15px;color:var(--ink2);margin:8px 0 26px;max-width:66ch}
  .btn{display:inline-flex;align-items:center;gap:10px;background:var(--green);color:#fff;border:0;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;padding:15px 26px;cursor:pointer;transition:background .18s}
  .btn:hover{background:var(--ink)}
  .btn[disabled]{background:var(--wash);color:var(--ink2);cursor:default}
  .btn.ghost{background:transparent;color:var(--ink2);border:1px solid rgba(23,22,26,.25)}
  .btn.ghost:hover{border-color:var(--ink);color:var(--ink)}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:30px;gap:14px}
  .nav .hint{font-size:13px;color:var(--ink2)}

  /* зов карусель */
  .cardwrap{display:flex;align-items:center;gap:16px;margin-top:8px}
  .arrow{flex:none;width:44px;height:44px;border:1px solid var(--rule2);background:transparent;color:var(--ink);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .18s}
  .arrow:hover{border-color:var(--accent)}
  .card{flex:1;background:var(--card);border:1px solid var(--rule);padding:34px 36px;min-height:230px;display:flex;flex-direction:column;justify-content:center;position:relative}
  .card .num{position:absolute;top:18px;right:22px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink2);letter-spacing:.14em}
  .zicon{width:58px;height:58px;margin-bottom:16px}.zicon svg{width:100%;height:100%;display:block}
  .card .name{font-family:'Oswald',sans-serif;font-weight:500;font-size:clamp(26px,3.4vw,38px);margin:0 0 12px}
  .card .line{font-size:clamp(16px,2vw,20px);color:var(--accent-ink)}
  .dots{display:flex;gap:7px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .dot{width:8px;height:8px;background:var(--rule2);cursor:pointer}.dot.on{background:var(--accent)}
  .check{display:inline-flex;align-items:center;gap:12px;margin-top:24px;cursor:pointer;user-select:none;border:1px solid var(--rule2);padding:13px 20px;transition:border-color .15s,background .15s}
  .check:hover{border-color:var(--ink)}
  .check .box{width:19px;height:19px;border:1.6px solid var(--ink);flex:none;position:relative;transition:all .15s}
  .check.on{background:var(--green);border-color:var(--green)}
  .check.on .box{background:#fff;border-color:#fff}
  .check.on .box::after{content:"";position:absolute;left:5.5px;top:1px;width:6px;height:11px;border:solid var(--green);border-width:0 2.6px 2.6px 0;transform:rotate(45deg)}
  .check .lab{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
  .check.on .lab{color:#fff}

  /* выбор / опции */
  .opts{display:grid;gap:10px;margin-top:8px}
  .opt{text-align:left;background:var(--card);border:1px solid var(--rule);padding:18px 20px;cursor:pointer;font:inherit;color:var(--ink);transition:border-color .18s,background .18s}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{background:var(--sel);border-color:var(--accent)}
  .opt .ot{font-family:'Oswald',sans-serif;font-size:20px;margin-bottom:4px}
  .opt .od{font-size:14px;color:var(--ink2)}

  /* уровень ряд */
  .lrow{display:flex;gap:10px;margin-top:14px}
  .lcell{flex:1;display:flex;flex-direction:column;align-items:center;background:var(--card);border:1px solid var(--rule);padding:16px 8px 14px;cursor:pointer;transition:border-color .18s,background .18s;min-width:0}
  .lcell:hover{border-color:var(--accent)}.lcell.sel{border-color:var(--accent);background:var(--sel)}
  .lnum{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink2);margin-bottom:10px}.lcell.sel .lnum{color:var(--accent-ink)}
  .lbox{width:clamp(40px,5vw,54px);height:clamp(40px,5vw,54px);display:flex;align-items:center;justify-content:center;margin-bottom:12px}.lbox svg{width:100%;height:100%}
  .lname{font-family:'Oswald',sans-serif;font-size:15px;margin-bottom:4px;text-align:center;line-height:1.08}
  .ldesc{font-size:11px;color:var(--ink2);text-align:center;line-height:1.3}
  @media(max-width:560px){.ldesc{display:none}}

  /* элемент аудита */
  .elhead{display:flex;align-items:baseline;gap:14px}
  .elblk{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink)}
  .pitch{font-size:15.5px;color:var(--ink2);max-width:64ch;margin:14px 0 4px}
  .scale{border-top:1px solid var(--rule2);padding:20px 0 6px;margin-top:18px}
  .slq{font-size:14.5px;color:var(--ink);margin-bottom:14px;max-width:66ch}
  .slq .tag{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);display:block;margin-bottom:6px}
  .sl{display:flex;align-items:center;gap:18px}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:26px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:3px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--wash) var(--p,50%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--card);border:2px solid var(--accent);margin-top:-9px}
  input.w2::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--ink) var(--p,50%),var(--wash) var(--p,50%))}
  input.w2::-webkit-slider-thumb{border-color:var(--ink)}
  .val{font-family:'Oswald',sans-serif;font-size:22px;width:32px;text-align:center}
  /* аудит — новая механика */
  .elico{flex:none;width:30px;height:30px}.elico svg{width:100%;height:100%}
  .elnum{margin-left:auto;font-family:'Oswald',sans-serif;font-weight:600;font-size:clamp(40px,6vw,72px);line-height:.8;color:var(--accent)}
  .tgl{display:inline-flex;align-items:center;gap:9px;margin-top:20px;padding:11px 15px;border:1px solid var(--rule2);cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
  .tgl:hover{border-color:var(--ink);color:var(--ink)}
  .tglbox{border:1px solid var(--rule2);border-top:0;padding:16px 18px;font-size:14.5px;line-height:1.6;color:var(--ink2)}
  .tglbox div{padding:3px 0}
  .auditgrid{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:26px;padding-top:22px;border-top:1px solid var(--ink)}
  @media(max-width:640px){.auditgrid{grid-template-columns:1fr;gap:24px}}
  .acol .atag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#fff;padding:5px 9px}
  .acol .aq{font-size:15px;line-height:1.5;color:var(--ink2);margin:12px 0 0;min-height:4.4em}
  .arow{display:flex;align-items:center;gap:14px;margin-top:6px}
  .cells{flex:1;display:flex;gap:4px}
  .cell{flex:1;height:38px;cursor:pointer;transition:background .12s}
  .anum{font-family:'Oswald',sans-serif;font-weight:600;font-size:30px;width:40px;text-align:center}
  .deep{border:1px solid var(--rule);background:var(--card);padding:14px 18px;margin-top:10px}
  .deep .dq{font-size:14px;color:var(--ink2);line-height:1.5}
  .deep textarea{width:100%;margin-top:8px;background:var(--paper);border:1px solid var(--rule);padding:11px 13px;font:inherit;font-size:14px;color:var(--ink);resize:vertical;min-height:56px;border-radius:0}
  .deep textarea:focus{outline:none;border-color:var(--accent)}

  /* карта */
  .maprow{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--rule2)}
  .maprow .mn{font-family:'Oswald',sans-serif;font-size:16px;flex:none;width:190px}
  .barwrap{flex:1;position:relative;height:20px;background:var(--wash)}
  .barwrap .imp{position:absolute;top:0;left:0;height:100%;background:rgba(192,132,36,.35)}
  .barwrap .dev{position:absolute;top:5px;left:0;height:10px;background:var(--ink)}
  .mgap{font-family:'JetBrains Mono',monospace;font-size:12px;flex:none;width:74px;text-align:right}
  .blkband{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);margin:20px 0 2px}
  .headline{background:var(--ink);color:#FFFFFF;padding:24px 26px;margin-top:22px}
  .headline .t{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-lit);margin-bottom:10px}
  .headline .x{font-family:'Oswald',sans-serif;font-size:clamp(19px,2.3vw,26px);line-height:1.3}
  .legend{display:flex;gap:22px;margin-top:14px;font-size:12.5px;color:var(--ink2)}
  .legend span{display:flex;align-items:center;gap:7px}.legend i{width:12px;height:12px;display:inline-block}

  /* логики */
  .ladder{display:grid;gap:2px;margin-top:14px;border:1px solid var(--rule);background:var(--rule)}
  .rung{background:var(--card);padding:15px 20px;display:flex;gap:16px;align-items:baseline}
  .rung.focus{background:var(--sel)}
  .rung .rl{font-family:'Oswald',sans-serif;font-size:19px;flex:none;width:170px}
  .rung.focus .rl{color:var(--accent-ink)}
  .rung .rd{font-size:14px;color:var(--ink2)}
  .osrow{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
  @media(max-width:600px){.osrow{grid-template-columns:1fr}}
  .oscard{border:1px solid var(--rule);background:var(--card);padding:22px 24px}
  .oscard .ot{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px}
  .oscard .oh{font-family:'Oswald',sans-serif;font-size:22px;margin-bottom:8px}
  .oscard .ox{font-size:14.5px;color:var(--ink2)}

  /* форма / профиль */
  .field{margin:0 0 16px}
  .field label{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
  .field input,.field textarea{width:100%;background:var(--card);border:1px solid var(--rule);padding:13px 15px;font:inherit;font-size:15px;color:var(--ink);border-radius:0}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:560px){.grid2{grid-template-columns:1fr}}
  .profile{border:1px solid var(--ink);background:var(--card);padding:24px 26px;margin-top:6px}
  .profile h4{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin:0 0 14px}
  .pline{display:flex;gap:14px;padding:9px 0;border-top:1px solid var(--rule2);font-size:14px}
  .pline .pk{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink2);flex:none;width:150px;letter-spacing:.04em}
  .pline .pv{color:var(--ink2)}
  .todo{border:1px dashed var(--accent);background:var(--sel);padding:14px 18px;margin-top:14px;font-size:13.5px;color:var(--accent-ink);font-family:'JetBrains Mono',monospace;letter-spacing:.02em}

  /* герой + петля */
  .hero{display:grid;grid-template-columns:1fr 1.04fr;align-items:center;gap:clamp(28px,5vw,64px)}
  @media(max-width:760px){.hero{grid-template-columns:1fr;text-align:center;justify-items:center}.hero img{max-width:74%}}
  .hero img{width:100%;max-height:74vh;object-fit:contain;display:block;margin:0 auto}
  .ibody{display:grid;grid-template-columns:1fr 300px;gap:20px;margin-top:20px;align-items:start}
  @media(max-width:860px){.ibody{grid-template-columns:1fr}}
  .gcard{background:var(--card);border:1px solid var(--rule)}
  .canvas{width:100%;cursor:grab;touch-action:none;display:block}.canvas.drag{cursor:grabbing}
  .canvas svg{width:100%;aspect-ratio:1000/400;height:auto;display:block}
  .rail{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--rule)}
  .rcell{cursor:pointer;padding:13px 8px;text-align:center;border-right:1px solid var(--rule);transition:background .18s}
  .rcell:last-child{border-right:0}.rcell:hover,.rcell.on{background:var(--sel)}
  .rcell svg{width:30px;height:30px}
  .rcell .rn{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;color:var(--accent-ink);margin-top:6px}
  .rcell .rnm{font-family:'Oswald',sans-serif;font-size:14px;line-height:1.12;margin-top:2px}
  .pcard{background:var(--ink);color:#FFFFFF;padding:22px 24px}
  .pcard .m{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-lit)}
  .pcard .h{font-family:'Oswald',sans-serif;font-size:26px;line-height:1.1;margin-top:10px}
  .pcard .x{font-size:14.5px;line-height:1.55;color:#CFC9BB;margin-top:10px}

  /* мост — метрики 7 лет / 2-3 года */
  .duo{display:flex;align-items:center;gap:clamp(18px,4vw,50px);margin-top:32px;flex-wrap:wrap}
  .metric .mnum{font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(44px,7vw,88px);line-height:.86;color:var(--ink);text-transform:uppercase}
  .metric.hot .mnum{color:var(--green)}
  .metric .ms{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-top:10px;max-width:24ch;line-height:1.5}
  .marrow{font-family:'Oswald',sans-serif;font-weight:700;font-size:38px;color:var(--accent);line-height:1}
  .qnote{margin-top:32px;background:var(--wash);padding:22px 26px;font-size:clamp(15px,1.8vw,18px);line-height:1.55;color:var(--ink);max-width:66ch}
  .qsrc{display:block;margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
</style>

<div class="top"><div class="wrap">
  <div class="brand">Диагностика перехода</div>
  <div class="prog" id="prog"></div>
  <div class="stepn" id="stepn"></div>
</div></div>

<main><div class="wrap"><div id="app"></div></div></main>

  cv.addEventListener('pointerdown',function(e){ cv.classList.add('drag'); try{e.target.setPointerCapture&&e.target.setPointerCapture(e.pointerId);}catch(x){} lpSet(lpAt(e)); lpDrag=true; });
  cv.addEventListener('pointermove',function(e){ if(lpDrag)lpSet(lpAt(e)); });

  cv.addEventListener('pointerleave',function(){lpDrag=false;cv.classList.remove('drag');});

function lpBuild(){ if(!lpPath)return; lpLen=lpPath.getTotalLength(); if(!lpLen)return; lpSamp=[];
  for(var k=0;k<=1000;k++){ var p=lpPath.getPointAtLength(lpLen*k/1000); lpSamp.push([p.x,p.y]); }
  DATA.loop.nodes.forEach(function(n,i){ var best=0,bd=Infinity; for(var k=0;k<lpSamp.length;k++){ var dd=(lpSamp[k][0]-n[0])*(lpSamp[k][0]-n[0])+(lpSamp[k][1]-n[1])*(lpSamp[k][1]-n[1]); if(dd<bd){bd=dd;best=k;} } DATA.loop.phases[i].t=best/1000; }); }
function lpAt(e){ var svg=document.getElementById('lpSvg'), r=svg.getBoundingClientRect(); var sc=Math.min(r.width/1000,r.height/400);
  var ox=(r.width-1000*sc)/2, oy=(r.height-400*sc)/2, x=(e.clientX-r.left-ox)/sc, y=(e.clientY-r.top-oy)/sc;
  var best=0,bd=Infinity; for(var k=0;k<lpSamp.length;k++){ var dd=(lpSamp[k][0]-x)*(lpSamp[k][0]-x)+(lpSamp[k][1]-y)*(lpSamp[k][1]-y); if(dd<bd){bd=dd;best=k;} } return best/1000; }
function lpNearest(){ var i=0,d=Infinity; DATA.loop.phases.forEach(function(p,k){ var dd=Math.abs(p.t-lpT); if(dd<d){d=dd;i=k;} }); return i; }
function lpSet(t){ lpT=Math.max(0,Math.min(1,t)); lpRender(); }
function lpRender(){ if(!lpLen)return; var q=lpPath.getPointAtLength(lpLen*lpT);
  var dot=document.getElementById('lpDot'); if(dot){dot.setAttribute('cx',q.x);dot.setAttribute('cy',q.y);}
  document.getElementById('lpProg').setAttribute('stroke-dasharray',(lpLen*lpT)+' '+lpLen);
  var i=lpNearest(), ph=DATA.loop.phases[i];
  document.getElementById('lpMeta').textContent=ph.meta; document.getElementById('lpTitle').textContent=ph.title; document.getElementById('lpText').textContent=ph.text;
  var rail=document.getElementById('lpRail'); [].forEach.call(rail.children,function(c,k){ c.className='rcell'+(k===i?' on':'');
    var stroke=(k===i)?(k===4?'#2F5A2A':'#8A5A12'):K; var rp=document.getElementById('lpRp'+k); if(rp)rp.innerHTML=sg(PHSIGN[k],stroke,1.8); }); }

/* ---- ЛИД / ПРОФИЛЬ / CTA ---- */
function scLead(){
  var c=LP.contact||{};
  app.innerHTML='<div class="kick">'+DATA.cta.kick+'</div><h2>Ваш стратегический профиль</h2>'+
    '<p class="q">Эксперт увидит не просто заявку, а карту вашего перехода. Оставьте контакт.</p>'+
    '<div class="grid2"><div class="field"><label>Имя</label><input id="c_name" value="'+esc(c.name)+'" placeholder="Как обращаться"></div>'+
    '<div class="field"><label>Роль</label><input id="c_role" value="'+esc(c.role)+'" placeholder="Собственник / CEO"></div>'+
    '<div class="field"><label>Компания</label><input id="c_comp" value="'+esc(c.comp)+'" placeholder="Название"></div>'+
    '<div class="field"><label>Контакт</label><input id="c_contact" value="'+esc(c.contact)+'" placeholder="Телефон / телеграм / почта"></div></div>'+
    profileCard()+
    nav("go('logics')","go('cta')");
  setProg();
}
function collectContact(){ LP.contact={name:v('c_name'),role:v('c_role'),comp:v('c_comp'),contact:v('c_contact')}; saveLP(); }
function v(id){ var e=document.getElementById(id); return e?(e.value||'').trim():''; }
function profileCard(){
  var branch=LP.branch==='self'?'Личная стратегия':(LP.branch==='biz'?'Бизнес-стратегия':'—');
  var gapName='—';
  if(LP.branch==='self'){ try{ var sa=JSON.parse(localStorage.getItem('samoaudit.v2')||'null'); if(sa&&sa.imp){ var bi=0,bg=-99; for(var k=0;k<7;k++){ var gg=sa.imp[k]-sa.wrk[k]; if(gg>bg){bg=gg;bi=k;} } gapName=DATA.personal.elements[bi].name; } }catch(e){} }
  else if(LP.branch==='biz'&&LP.business.imp.length){ var g2=gaps(LP.business.imp,LP.business.state).sort(function(a,b){return b.gap-a.gap;})[0]; gapName=flatBiz()[g2.i].name; }
  var cons={self:'Во мне',biz:'В бизнесе',both:'И там, и там'}[LP.constraint]||'—';
  var lvlW=LP.level!=null?(LP.level<=DATA.level.weakMax?'слабый':'сильный'):'—';
  return '<div class="profile"><h4>Профиль для команды продаж</h4>'+
    pl('Зов', LP.zov!=null?DATA.calls.items[LP.zov].name:'—')+
    pl('Уровень зова', LP.level!=null?(LP.level+' / 5 · '+LP.levelName+' · '+lvlW):'—')+
    pl('Где ограничение', cons)+
    pl('Ветка аудита', branch)+
    pl('Точка напряжения', gapName)+
    pl('Завершённость', LP.done?'диагностика пройдена':'в процессе')+
    '</div>';
}
function pl(k,val){ return '<div class="pline"><div class="pk">'+k+'</div><div class="pv">'+val+'</div></div>'; }
function scCTA(){
  var c=DATA.cta; LP.done=true; collectContactSafe(); saveLP();
  app.innerHTML='<div class="kick">'+c.kick+'</div><h2>'+c.title+'</h2><p class="lead">'+c.text+'</p>'+
    profileCard()+
    '<div class="nav"><button class="btn ghost" onclick="go(\'lead\')">Назад</button><button class="btn" onclick="alert(\'Прототип: профиль ушёл бы в CRM. Backend не подключён.\')">'+c.button+' →</button></div>';
  setProg();
}
function collectContactSafe(){ if(document.getElementById('c_name'))collectContact(); }

/* ---- роутер ---- */
var SCREENS={hero:scHero,loop:scLoop,bridge:scBridge,call:scCall,callRes:scCallRes,level:scLevel,levelRes:scLevelRes,transition:scTransition,transThought:scTransThought,choice:scChoice,
  pIntro:scPIntro,pAudit:scPAudit,pMap:scPMap,bIntro:scBIntro,bAudit:scBAudit,bMap:scBMap,
  postAudit:scPostAudit,vertical:scVertical,logics:scLogics,lead:scLead,cta:scCTA};
function go(s){ if(state.screen==='lead')collectContactSafe(); state.screen=s; window.scrollTo(0,0); SCREENS[s](); }
go('hero');
</script>
